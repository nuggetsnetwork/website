<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bigg Boss Tracker — Season 20</title>
    <link rel="icon" type="image/png" href="./images/bbtracker.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0f0f1a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
      ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a1a2e; }
      ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
    </style>
    <script>
      // Restore path encoded by the root 404.html redirect.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          params.delete('p');
          var qs = params.toString();
          // Strip trailing slash from base so joining with p (which starts with /)
          // doesn't produce a double slash: '/Products/biggboss' + '/contestant/x'
          var base = window.location.pathname.replace(/\/$/, '');
          var newUrl = (p === '/' ? base + '/' : base + p) +
                       (qs ? '?' + qs : '') + window.location.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
    <script type="module" crossorigin src="/Products/biggboss/assets/index-D4gxF9kt.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
