    <script>
      // Restore path encoded by the root 404.html redirect.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          params.delete('p');
          var qs = params.toString();
          // Strip trailing slash from base so joining with p (which starts with /)
          // doesn't produce a double slash: '/Products/biggboss' + '/contestant/x'
          var base = window.location.pathname.replace(/\/$/, '');
          var newUrl = (p === '/' ? base + '/' : base + p) +
                       (qs ? '?' + qs : '') + window.location.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
